# Builds Gallery as a universal (arm64 + x86_64) macOS app, signs it with the
# Modalics LLC Developer ID, notarizes it with Apple and uploads the stapled
# .zip as a build artifact.
#
# Repository secrets this needs:
#   MACOS_CERTIFICATE      base64 of the "Developer ID Application" .p12
#                          (`base64 -i certificate.p12 | pbcopy`)
#   MACOS_CERTIFICATE_PWD  password the .p12 was exported with
#   APPLE_ID               Apple ID of the Modalics LLC account
#   APPLE_APP_PASSWORD     app-specific password from appleid.apple.com
#   APPLE_TEAM_ID          10-character Modalics LLC team id

name: macOS Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal, signed and notarized
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APP_NAME: Gallery
      APP_PATH: build/Apps/Gallery/Gallery.app
      ZIP_PATH: Gallery-macOS-universal.zip

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -G Ninja -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DEACP_CI_BUILD=ON
          -DSHADERTOY_UNITY_BUILD=ON
          -DSHADERTOY_ENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --target "$APP_NAME"

      - name: Check the binary is universal
        run: |
          binary="$APP_PATH/Contents/MacOS/$APP_NAME"
          archs=$(lipo -archs "$binary")
          echo "$binary: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::$arch slice missing"; exit 1 ;;
            esac
          done

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          certificate="$RUNNER_TEMP/certificate.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          if [ -z "$identity" ]; then
            echo "::error::the imported .p12 holds no Developer ID Application identity"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi

          echo "Signing as $identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign
        run: |
          # Nested code carries its own signature before the bundle is sealed
          # around it; the loop is a no-op for a bundle that has none.
          while IFS= read -r -d '' nested; do
            codesign --force --timestamp --options runtime \
              --sign "$SIGNING_IDENTITY" "$nested"
          done < <(find "$APP_PATH/Contents" \
            \( -name '*.dylib' -o -name '*.so' -o -name '*.framework' \) -print0)

          codesign --force --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"

          report="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json > "$report" || true
          cat "$report"

          field() {
            plutil -extract "$1" raw -o - -- "$report" 2>/dev/null || true
          }
          submission=$(field id)
          verdict=$(field status)

          if [ "$verdict" != "Accepted" ]; then
            echo "::error::notarization returned ${verdict:-no response}"
            if [ -n "$submission" ]; then
              xcrun notarytool log "$submission" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID"
            fi
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Zip
        run: ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-macOS-universal-${{ github.sha }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security list-keychains -d user -s login.keychain-db
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
